[project]
name = "pysgf"
version = "1.0.0"
description = "Simple parser for Go game records (SGF, NGF, GIB)"
authors = [{ name = "Sander Land" }]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "chardet>=5.2.0,<6",
]

[dependency-groups]
dev = [
    "black>=24.8.0,<25",
    "pytest>=8.0,<9",
]
docs = [
    "sphinx>=8.0,<9",
    "sphinx-rtd-theme>=3.0,<4",
]

[tool.uv]
default-groups = ["dev"]

[tool.black]
line-length = 120
target-version = ["py311"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
