[project]
name = "pysgf"
version = "1.0.0"
description = "Simple parser for Go game records (SGF, NGF, GIB)"
authors = [{ name = "Sander Land" }]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "chardet>=5.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.12",
]
docs = [
    "sphinx>=8.0,<9",
    "sphinx-rtd-theme>=3.0,<4",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
