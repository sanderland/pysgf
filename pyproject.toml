[project]
name = "pysgf"
version = "0.9.0"
description = "Simple SGF parser"
authors = [{ name = "Sander Land" }]
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
    "chardet>=5.2.0,<6",
]

[dependency-groups]
dev = [
    "black>=24.8.0,<25",
    "pytest>=8.0,<9",
]

[tool.uv]
default-groups = ["dev"]

[tool.black]
line-length = 120

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
